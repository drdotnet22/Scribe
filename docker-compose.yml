services:
  app:
    build: .
    # Only reachable from the server itself; everyone else goes through Caddy.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    environment:
      TZ: America/New_York
    restart: unless-stopped

  # HTTPS front door: https://scribe.local:5877 (see the README)
  caddy:
    image: caddy:2
    ports:
      - "5877:5877"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped
