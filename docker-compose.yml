services:
  app:
    build: .
    # Only reachable from the server itself; everyone else goes through Caddy.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    environment:
      TZ: America/New_York
      JOPLIN_URL: ${JOPLIN_URL:-}   # set in .env to turn on the Joplin sync (see the README)
      # Sign-in (OpenID Connect: Pocket ID or any standard provider). Set these in .env; see the README.
      APP_URL: ${APP_URL:-https://scribe.local:5877}       # the address you open Scribe at
      OIDC_ISSUER: ${OIDC_ISSUER:-}                         # e.g. https://id.example.com for Pocket ID
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}           # leave empty for a public (PKCE) client
      AUTH_ALLOWED_USER: ${AUTH_ALLOWED_USER:-}             # the one account allowed in: email, username or subject id
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      SESSION_DAYS: ${SESSION_DAYS:-30}                     # stay signed in this long (renewed as you use it)
      SESSION_SECRET: ${SESSION_SECRET:-}                   # optional; otherwise one is made in ./data/session-secret
      AUTH_DISABLED: ${AUTH_DISABLED:-false}                # true turns sign-in off (not recommended)
    restart: unless-stopped

  # Optional: keeps each job's notes in step with your Joplin. Only starts when .env has COMPOSE_PROFILES=joplin.
  joplin:
    profiles: ["joplin"]
    build: ./joplin
    volumes:
      - ./joplin-data:/root/.config/joplin
    environment:
      TZ: America/New_York
      JOPLIN_SERVER_URL: ${JOPLIN_SERVER_URL:-}
      JOPLIN_USERNAME: ${JOPLIN_USERNAME:-}
      JOPLIN_PASSWORD: ${JOPLIN_PASSWORD:-}
    restart: unless-stopped

  # HTTPS front door: https://scribe.local:5877 (see the README)
  caddy:
    image: caddy:2
    ports:
      - "5877:5877"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped
